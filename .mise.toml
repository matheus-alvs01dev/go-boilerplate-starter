[tools]
go = "1.24.4"
node = "20"
golangci-lint = "2.4.0"

[env]
# Environment variables can be set here
# They will be loaded automatically when entering the project directory
CGO_ENABLED = "1"
GOOS = "linux"
GOARCH = "amd64"

[tasks.install-deps]
description = "Install Go development dependencies"
run = [
  "go install go.uber.org/mock/mockgen@latest",
  "go install github.com/pressly/goose/v3/cmd/goose@latest", 
  "go install github.com/air-verse/air@latest",
  "go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest"
]

[tasks.server]
description = "Run the server"
run = "go run cmd/server/main.go"

[tasks.dev]
description = "Run the server in development mode with air"
run = "air"

[tasks.migration-create]
description = "Create a new database migration (use: mise migration-create nome_of_your_migration)"
run = "bash -c 'goose -dir internal/adapters/db/migrations create \"${1:-migration}\" sql' -- \"$@\""

[tasks.migration-up]
description = "Run database migrations up"
run = "goose -dir internal/adapters/db/migrations/ postgres \"$DATABASE_URL\" up"

[tasks.migration-down]
description = "Run database migrations down"
run = "goose -dir internal/adapters/db/migrations/ postgres \"$DATABASE_URL\" down"

[tasks.migration-status]
description = "Check migration status"
run = "goose -dir internal/adapters/db/migrations/ postgres \"$DATABASE_URL\" status"

[tasks.test]
description = "Run tests with coverage"
run = "go test -v ./... --cover"

[tasks.test-watch]
description = "Run tests in watch mode"
run = "watchexec -e go -- go test -v ./... --cover"


[tasks.lint]
description = "Run linter locally (golangci-lint)"
run = "golangci-lint run -v -c dev/golangci.yaml ./..."

[tasks.build]
description = "Build the application"
run = "go build -o tmp/main cmd/server/main.go"

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf tmp/main"

[tasks.docker-up]
description = "Start Docker services"
run = "docker-compose up -d"

[tasks.docker-down]
description = "Stop Docker services" 
run = "docker-compose down"

[tasks.docker-logs]
description = "Show Docker logs"
run = "docker-compose logs -f"

[tasks.setup]
description = "Setup the project (install deps + start database)"
depends = ["install-deps", "docker-up"]

[tasks.sqlc-generate]
description = "Generate SQL code using sqlc"
run = "sqlc generate"
